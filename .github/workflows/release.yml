name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o stoat ./cmd/stoat
            tar czf stoat_${GITHUB_REF_NAME}_linux_$arch.tar.gz stoat
          done
          sha256sum stoat_*.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            checksums.txt
