name: ci

on:
  # Only main on push. Without the branch filter, a PR branch fires BOTH the
  # push and the pull_request event and the whole suite runs twice per commit.
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # The same four gates as `just check` + `just test`, so a green CI means
      # what a clean local run means. gofmt is checked here because nothing
      # else stops a formatting regression from landing on main.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      # go test already runs packages in parallel. -failfast stops the run at
      # the first failing test, so a broken commit reports in seconds rather
      # than after the whole suite.
      - name: test
        run: go test -failfast ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      # Warning level: an info-level note about a quoted variable in a
      # bundled installer is not worth a red PR.
      - name: shellcheck
        run: shellcheck -S warning $(git ls-files 'internal/recipes/bundled/*.sh' 'internal/recipes/bundled/*/*.sh' 'scripts/*.sh' '.githooks/*')

  host-primitives:
    name: host-primitives (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: build CLI
        run: go build ./cmd/stoat
      - name: file locks
        run: go test ./internal/filelock
      - name: host guards
        run: go test ./internal/hostops ./internal/hostcheck
      - name: refusal boundaries
        run: go test ./internal/config ./internal/qemu ./internal/cli ./internal/tui -run '^(TestUnsupported|TestHostDiagnostics|TestHostConfig|TestCapabilitiesNative)'
