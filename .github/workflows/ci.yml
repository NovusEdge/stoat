name: ci

on:
  # Only main on push. Without the branch filter, a PR branch fires BOTH the
  # push and the pull_request event and the whole suite runs twice per commit.
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # The same four gates as `just check` + `just test`, so a green CI means
      # what a clean local run means. gofmt is checked here because nothing
      # else stops a formatting regression from landing on main.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      # Warning level: an info-level note about a quoted variable in a
      # bundled installer is not worth a red PR.
      - name: shellcheck
        run: shellcheck -S warning $(git ls-files 'internal/recipes/bundled/*.sh' 'internal/recipes/bundled/*/*.sh' 'scripts/*.sh' '.githooks/*')

  # A separate job because it needs Python rather than Go, and because a
  # failure here should read as "the MCP server broke", not "the Go suite
  # broke". Until this existed, mcp/'s tests ran only on a contributor's
  # machine, so a regression in guards.py (the deterministic blocks that are
  # the whole security boundary, since MCP guarantees nothing itself) would
  # have merged green.
  mcp:
    name: mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5

      - name: install
        run: uv pip install --system -e '.[dev]'
      - name: test
        run: pytest -q
