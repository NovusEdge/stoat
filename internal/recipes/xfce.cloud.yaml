#cloud-config
# XFCE desktop fragment for the cloudinit backend. cloud-init's packages: list
# is handed to the guest's own package manager, so these names must be real on
# apt AND pacman; Fedora needs @-group syntax and gets its own fragment.
packages:
  - xfce4
  - xfce4-terminal
  # lightdm gives a graphical LOGIN SCREEN, which is the right shape for a
  # cloud image: it has a real user account (stoat), unlike the Alpine live
  # recipe's single-user autologin. Verified present under these exact names
  # in both Debian bookworm and Arch's extra repo.
  #
  # It also sidesteps a trap: `startx` lives in the separate `xinit` package
  # on Debian/Ubuntu but `xorg-xinit` on Arch, so a shared fragment cannot
  # name it. A display manager needs neither.
  - lightdm
  - lightdm-gtk-greeter

# Cloud images boot to multi-user.target with no graphics. Switching the
# default and starting lightdm brings the desktop up on the qemu console in
# this boot, not just after a reboot.
#
# Log in as the `stoat` user with the console password stoat set at creation
# (see the console row on the detail screen). Earlier versions of this
# fragment configured /root/.xinitrc and autologged root in, copied from the
# Alpine recipe, where root IS the user. On a cloud image root is locked and
# you connect as stoat, so that configured a desktop for an account nobody
# can reach.
runcmd:
  - systemctl enable lightdm
  - systemctl set-default graphical.target
  - systemctl start lightdm
