#cloud-config
# Baseline devtools for the cloudinit backend: version control, something to
# fetch things with, an editor, a multiplexer, a pager. Mirrors
# devtools.alpine.sh's list minus two things:
#
#   - The compiler toolchain. It is build-essential (apt), base-devel
#     (pacman — itself a package GROUP, not a single package) and
#     @development-tools (dnf group syntax): three different names and three
#     different installation shapes for one package. Splitting this fragment
#     per-OS just to cover a compiler is not worth it; install your distro's
#     own name yourself if you need one.
#   - bash. Alpine's default shell is ash with no bash unless asked for;
#     every cloud image here (Ubuntu/Debian/Arch) already ships bash as the
#     login shell, so listing it would be a no-op.
#
# Every name below was checked against the real package indexes
# (packages.debian.org/bookworm and /trixie, packages.ubuntu.com/noble,
# archlinux.org's package search JSON, mdapi.fedoraproject.org/f43) and is
# spelled identically on apt and pacman. dnf is the odd one out: Fedora has
# no package literally named "vim" (only vim-enhanced, vim-minimal, etc —
# mdapi returns 400 for a bare "vim" lookup), so this fragment is NOT safe
# for Fedora as-is and is deliberately not offered there — see the cloudOS
# comment in recipes.go for why Fedora stays out of the shared-fragment set
# rather than being added to it.
packages:
  - git
  - curl
  - ca-certificates
  - vim
  - tmux
  - less
