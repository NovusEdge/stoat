#cloud-config
# XFCE desktop fragment for Alpine on the cloudinit backend.
#
# Alpine needs its own fragment, not the shared xfce.cloud.yaml, for two
# independent reasons:
#
#   - Alpine boots OpenRC, not systemd. The shared fragment's runcmd is
#     `systemctl enable/start lightdm`; there is no systemctl binary on
#     Alpine to run it. The OpenRC equivalents are rc-update/rc-service.
#   - cloud-init's packages: module installs before runcmd runs, but a
#     stock Alpine cloud image ships with the community repo commented out
#     in /etc/apk/repositories — and every package this fragment needs
#     (xfce4, lightdm, elogind, ...) lives in community, not main. A
#     packages: list would fail outright, before runcmd ever got a chance
#     to enable the repo it needs. So this fragment does everything through
#     runcmd instead, via Alpine's own setup-xorg-base/setup-desktop
#     tooling (alpine-conf, part of every Alpine install — xfce.alpine.sh,
#     the live-ISO sibling of this fragment, already depends on it) rather
#     than reimplementing what that tooling does by hand.
#
# setup-xorg-base (verified against its actual source at
# github.com/alpinelinux/alpine-conf, setup-xorg-base.in):
#   - runs `setup-apkrepos -o` first, which enables the community repo for
#     every already-configured main repo and refreshes indexes — so the
#     packages named on its command line resolve without a separate
#     repo-enable step here.
#   - installs xorg-server, xf86-input-libinput, xinit, eudev and
#     mesa-dri-gallium — the actual X server and its input/GPU/udev stack —
#     before the packages named on its command line. Skipping this and
#     naming only the desktop packages is exactly the failure mode that
#     produced a black screen with a working serial console elsewhere in
#     this codebase: a desktop installed with no X server under it.
#   - switches /dev management from Alpine's default mdev to udev.
#     xf86-input-libinput hard-requires udev's backend; it does not work
#     against mdev. eudev is in its package list for this reason.
#
# The desktop package list below (elogind, gvfs, lightdm,
# lightdm-gtk-greeter, polkit-elogind, xfce4-terminal, xfce4) matches
# alpine-conf's own `setup-desktop xfce` case (setup-desktop.in) exactly,
# minus firefox and xfce4-screensaver/font-dejavu — optional extras this
# fragment leaves out for the same reason the shared xfce.cloud.yaml stays
# minimal.
#
# elogind + polkit-elogind stand in for systemd-logind's session-management
# role, which Alpine does not have.
#
# dbus-openrc: a first boot-test on real Alpine 3.24.1 (cloud-init's own
# log) showed `setup-xorg-base` and `rc-update add lightdm` both succeeding,
# then "ERROR: cannot start lightdm as dbus would not start". apk's `dbus`
# package (a dependency of both lightdm and elogind) installs the daemon
# binary, but its OpenRC init script ships in a SEPARATE subpackage,
# dbus-openrc — confirmed against pkgs.alpinelinux.org's file listing for
# it (/etc/init.d/dbus) — and nothing here was pulling that subpackage in.
# lightdm's own init script declares `need dbus`; without dbus-openrc
# installed there is no "dbus" service for that dependency to resolve to.
# Two independently-published Alpine xfce/lightdm setup guides both
# explicitly `rc-update add dbus` before lightdm for exactly this reason,
# which is what below now does too.
#
# elogind, by contrast, does NOT need its own rc-update: alpine-conf's
# setup-desktop.in and both of those guides enable only dbus and lightdm,
# never elogind, and elogind's own package ships
# /usr/share/dbus-1/system-services/org.freedesktop.login1.service —
# confirmed against pkgs.alpinelinux.org's file listing for the elogind
# package — a D-Bus activation file. Once dbus itself is running, dbus
# launches elogind on demand the first time something calls
# org.freedesktop.login1; no persistently-running elogind service is
# required for lightdm to get a working session backend.
#
# rc-service ... start (not just rc-update add ...) is deliberate here, not
# left for next boot: cloud images are always a real disk install (never
# the diskless/live case), so a start-now attempt costs nothing if it fails
# — both services are also added to the default runlevel, so a subsequent
# boot brings them up regardless — and it matches the shared
# xfce.cloud.yaml's own goal of a desktop on the console in THIS boot, not
# a promise redeemed only after a manual reboot.
#
# Checked against alpine-conf's upstream source and against a real
# boot-test failure (the dbus gap above) — the rest of this fragment is
# unverified until the corrected version passes its own boot test.
runcmd:
  - setup-xorg-base xfce4 elogind gvfs lightdm lightdm-gtk-greeter polkit-elogind xfce4-terminal dbus-openrc
  - rc-update add dbus default
  - rc-service dbus start
  # A cloud image has a real user account (stoat), so this gets a login
  # screen rather than the single-user autologin the live-ISO Alpine recipe
  # uses — same reasoning as the shared xfce.cloud.yaml. Log in as stoat
  # with the console password set at creation.
  - rc-update add lightdm default
  - rc-service lightdm start
