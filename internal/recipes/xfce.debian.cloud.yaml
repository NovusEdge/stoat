#cloud-config
# XFCE desktop fragment for Debian cloud images.
#
# debian-13-genericcloud ships linux-image-cloud-amd64, a minimal flavour with
# no drivers/gpu/drm module tree at all: no /dev/dri, no /dev/fb0, so lightdm
# waits on a seat that can never display anything. The failure is silent and
# looks like success: cloud-init reports "status: done", xfce4 installs
# cleanly, and lightdm shows "active", but no Xorg process exists. The fix
# is to install the full kernel and purge the cloud one.
packages:
  # The full kernel flavour, which is the entire point of this fragment.
  - linux-image-amd64
  - xfce4
  - xfce4-terminal
  # lightdm gives a graphical LOGIN SCREEN, which is the right shape for a
  # cloud image: it has a real user account (stoat), and root is locked.
  - lightdm
  - lightdm-gtk-greeter

runcmd:
  # One block, not one item per command, because the first line is a GUARD and
  # cloud-init runs each runcmd item independently, so a bare `exit 0` in its
  # own item would skip nothing.
  - |
    set -e

    # Repair: plymouth's initramfs hook can run before fontconfig is
    # configured, failing update-initramfs and leaving linux-image-amd64
    # "install ok unpacked" instead of installed. By runcmd, apt has
    # finished configuring everything else, so re-running fixes it.
    # `|| true`: the guard below decides whether it's safe to continue.
    DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true

    # Guard: do nothing unless the full kernel actually installed. The
    # package step can fail (e.g. transient DNS) while runcmd still runs,
    # and purging below would otherwise remove the only kernel.
    dpkg-query -W -f='${Status}' linux-image-amd64 2>/dev/null \
      | grep -q '^install ok installed' || exit 0

    # linux-base/removing-running-kernel defaults to aborting the purge
    # (or hanging on the debconf prompt); preseed false so it proceeds.
    # Safe here: the running kernel is already loaded in memory.
    echo 'linux-base linux-base/removing-running-kernel boolean false' \
      | debconf-set-selections

    # Purge the cloud kernel instead of reordering GRUB: installing the
    # full kernel alongside it isn't enough since GRUB_DEFAULT=0 boots
    # whichever is listed first, and the cloud kernel is. Both package
    # names are needed: linux-image-cloud-amd64 is only a meta-package,
    # so purging it alone leaves the real linux-image-<version>-cloud-amd64
    # installed and update-grub still finds two kernels.
    DEBIAN_FRONTEND=noninteractive \
      apt-get purge -y linux-image-cloud-amd64 "linux-image-$(uname -r)"

    update-grub
    systemctl enable lightdm
    systemctl set-default graphical.target

    # Required: the running cloud kernel can't load a DRM driver no matter
    # what's installed, so lightdm needs the full kernel booted first.
    reboot
