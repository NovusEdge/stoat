#cloud-config
# XFCE desktop fragment for Fedora on the cloudinit backend.
#
# Fedora needs its own fragment because it has no package literally named
# "xfce4" — the desktop ships as the comps group @xfce-desktop-environment.
# The shared xfce.cloud.yaml lists plain "xfce4"/"xfce4-terminal", which are
# real on apt and pacman, so mixing an "@group" token into that one file would
# break Ubuntu/Debian/Arch. cloud-init's packages:
  - "@xfce-desktop-environment"
  # Fedora's Xfce group ships lightdm, but naming it explicitly means this
  # fragment does not depend on the group's contents staying that way.
  - lightdm

# Same reasoning as the shared fragment: a cloud image has a real user
# account (stoat), so it gets a login screen rather than the single-user
# autologin the Alpine recipe uses. Log in as stoat with the console password.
runcmd:
  - systemctl enable lightdm
  - systemctl set-default graphical.target
  - systemctl start lightdm
