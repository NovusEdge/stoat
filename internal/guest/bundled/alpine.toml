# This file is one guest OS. Spec 1 covers sh-shaped guests with an
# imperative package manager; NixOS, OpenBSD, and Windows need another model.
schema = 1
name = "alpine"
init = "openrc"
shell = "/bin/ash"
installer = "setup-alpine"
default_backend = "apkovl"
default_ssh_user = "root"
escalate = ["sudo", "-n"]
capabilities = ["apk"]
aliases = []
filename_hints = ["alpine"]
seed_packages = ["sudo"]
log_path = "/var/log/messages"

[pkg]
# -c enables the community repository; -1 picks a mirror and refreshes the
# indexes, so a separate `apk update` is redundant. setup-apkrepos runs apk
# update with no lock-wait, so a concurrent apk holding the database lock
# fails it with exit 99; retry until the lock frees.
setup = """
n=0
until setup-apkrepos -c -1; do
    n=$((n + 1))
    [ "$n" -ge 30 ] && { echo "apk database stayed locked; giving up" >&2; exit 1; }
    sleep 2
done"""
install = ["apk", "--wait", "60", "add"]
scaffold_setup = "stoat_pkg_setup\n"
scaffold_install = "apk add "
runtime_packages = { python3 = "python3" }

[svc]
enable = "rc-update add {name} default"
start = "rc-service {name} start"
stop = "rc-service {name} stop"
restart = "rc-service {name} restart"
status = "rc-service {name} status"

[cmd]
download = "wget -O"
useradd = "adduser -D {name}"

[backend.cloudinit]
skip_9p = false
