# Every field in a guest definition. A guest file describes the image and its
# package/service surface; recipes consume these facts through the prelude.
schema            = 1
name              = "alpine"
shell             = "/bin/ash"
init              = "openrc"
installer         = "setup-alpine"
default_backend   = "apkovl"
default_ssh_user  = "root"
escalate          = ["sudo", "-n"]
capabilities      = ["apk"]
aliases           = []
filename_hints    = ["alpine"]
seed_packages     = ["sudo"]

[pkg]
setup             = "apk update"
install           = ["apk", "--wait", "60", "add"]
env               = {}
scaffold_setup    = "setup-apkrepos -c -1"
scaffold_install  = "apk add "
runtime_packages  = { python3 = "python3" }

[svc]
enable  = "rc-update add {name} default"
start   = "rc-service {name} start"
stop    = "rc-service {name} stop"
restart = "rc-service {name} restart"
status  = "rc-service {name} status"

[cmd]
download = "wget -O"
useradd  = "adduser -D {name}"

[backend.cloudinit]
skip_9p = false
